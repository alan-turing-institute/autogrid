[project]
name = "autogrid"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = []
requires-python = ">=3.11"
dependencies = [
    "cartopy>=0.26.0",
    "scitools-iris>=3.13",
]

[project.scripts]
