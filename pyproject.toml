[project]
name = "autogrid"
version = "0.0.1"
description = "Grid generation and regridding for geospatial data."
readme = "README.md"
authors = []
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pyproj>=3.7.2",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
plot = [
    "cartopy>=0.26.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cartopy>=0.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    # Checks the regridding weights against iris
    "scitools-iris>=3.13",
    "ty>=0.0.88",
]
